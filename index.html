<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>体素爆破足球 - Voxel Blast Soccer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      overflow: hidden;
      font-family: 'Arial', sans-serif;
      background: #000;
    }
    #canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    #ui {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      color: white;
      font-size: 20px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
    }
    #score {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 32px;
      font-weight: bold;
      background: rgba(0,0,0,0.6);
      padding: 10px 30px;
      border-radius: 10px;
    }
    #controls {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: rgba(0,0,0,0.7);
      padding: 15px;
      border-radius: 10px;
      font-size: 16px;
      line-height: 1.6;
    }
    #message {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 48px;
      font-weight: bold;
      text-align: center;
      opacity: 0;
      transition: opacity 0.3s;
      background: rgba(0,0,0,0.8);
      padding: 30px 60px;
      border-radius: 20px;
      pointer-events: none;
    }
    #message.show {
      opacity: 1;
    }
    .goal-text {
      color: #ffdd00;
      text-shadow: 0 0 20px #ffdd00;
    }
    #pause {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(0,0,0,0.7);
      padding: 10px 20px;
      border-radius: 5px;
      pointer-events: auto;
      cursor: pointer;
      user-select: none;
    }
    #pause:hover {
      background: rgba(0,0,0,0.9);
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="ui">
    <div id="score">
      <span id="playerScore">0</span> : <span id="aiScore">0</span>
      <div style="font-size: 16px; margin-top: 5px;"><span id="time">00:00</span></div>
    </div>
    <div id="controls" style="pointer-events: none;">
      <strong style="color: #ffdd00;">WASD移动 空格射门 P暂停</strong><br>
    </div>
    <div id="pause" style="pointer-events: auto;">暂停 (P)</div>
    <div id="message"></div>
  </div>
  <script type="module" src="/main.js"></script>
</body>
</html>
